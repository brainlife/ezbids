---
name: Jest Unit Tests

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  jest:
    name: Run Jest unit tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test -- --ci

      - name: Fetch Linux handler binaries
        run: bash fetch-binaries.sh linux amd64

      - name: Layer 1 — bundled runtime smoke
        env:
          EZBIDS_BIN_DIR: ${{ github.workspace }}/handler/bin
          EZBIDS_PLATFORM: linux
          EZBIDS_ARCH: amd64
          BIDS_VALIDATOR_PATH: ${{ github.workspace }}/node_modules/bids-validator/bin/bids-validator
        run: npm run smoke:bundled
