name: Build Desktop App

on:
    push:
        tags:
            - 'v*'

permissions:
    contents: write

jobs:
    create-release:
        runs-on: ubuntu-latest
        steps:
            - name: Create release
              uses: softprops/action-gh-release@v2
              with:
                  name: ${{ github.ref_name }}
                  draft: false
                  prerelease: false
                  generate_release_notes: true
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    build:
        needs: create-release
        strategy:
            fail-fast: false
            matrix:
                include:
                    - os: macos-latest
                      platform: darwin
                      arch: arm64
                      eb_flags: --mac --arm64
                    - os: windows-latest
                      platform: windows
                      arch: amd64
                      eb_flags: --win --x64
                    - os: ubuntu-latest
                      platform: linux
                      arch: amd64
                      eb_flags: --linux --x64

        runs-on: ${{ matrix.os }}

        defaults:
            run:
                shell: bash

        # specify bash for windows
        env:
            npm_config_script_shell: bash

        steps:
            - name: Checkout
              uses: actions/checkout@v4
              with:
                  submodules: recursive

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '20'

            - name: Install dependencies
              run: |
                  npm ci
                  (cd api && npm ci)
                  (cd handler && npm ci)
                  (cd ui && npm ci)
                  (cd electron && npm ci)

            - name: Fetch binaries
              run: bash fetch-binaries.sh ${{ matrix.platform }} ${{ matrix.arch }}
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

            - name: Clean dist
              run: rm -rf electron/dist

            - name: Build JS bundles
              working-directory: electron
              run: |
                  npm run build:electron-api
                  npm run build:electron-handler
                  npm run build:electron-handler-scripts

            - name: Copy Python files, BIDS schema, and templates
              working-directory: electron
              run: |
                  npm run build:electron-python
                  npm run build:electron-bids-spec
                  npm run build:electron-templates

            - name: Build frontend
              working-directory: ui
              run: npm run build:electron

            - name: Transpile main process
              working-directory: electron
              run: npx tsc

            - name: Validate Apple signing secrets
              if: matrix.platform == 'darwin'
              run: |
                  test -n "${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}"
                  test -n "${{ secrets.APPLE_CERTIFICATE_PASSWORD }}"
                  test -n "${{ secrets.APPLE_API_KEY_ID }}"
                  test -n "${{ secrets.APPLE_API_ISSUER }}"
                  test -n "${{ secrets.APPLE_API_KEY_P8_BASE64 }}"

            - name: Import Apple signing certificate
              if: matrix.platform == 'darwin'
              uses: apple-actions/import-codesign-certs@v3
              with:
                  p12-file-base64: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
                  p12-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

            - name: Create Apple API key file
              if: matrix.platform == 'darwin'
              run: |
                  python - <<'PY'
                  import base64
                  import os
                  from pathlib import Path

                  api_key = os.environ["APPLE_API_KEY_P8_BASE64"]
                  key_id = os.environ["APPLE_API_KEY_ID"]
                  out = Path(os.environ["RUNNER_TEMP"]) / f"AuthKey_{key_id}.p8"
                  out.write_bytes(base64.b64decode(api_key))
                  PY
              env:
                  APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}

            - name: Package (macOS signed + notarized)
              if: matrix.platform == 'darwin'
              working-directory: electron
              run: npx electron-builder ${{ matrix.eb_flags }}
              env:
                  APPLE_API_KEY: ${{ runner.temp }}/AuthKey_${{ secrets.APPLE_API_KEY_ID }}.p8
                  APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
                  APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
                  CSC_KEY_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}

            - name: Package (Windows/Linux)
              if: matrix.platform != 'darwin'
              working-directory: electron
              run: npx electron-builder ${{ matrix.eb_flags }}

            - name: Verify macOS code signing and notarization
              if: matrix.platform == 'darwin'
              working-directory: electron
              run: |
                  APP_PATH=$(ls release/*.app | head -n 1)
                  DMG_PATH=$(ls release/*.dmg | head -n 1)

                  echo "Verifying app signature: $APP_PATH"
                  codesign --verify --deep --strict --verbose=2 "$APP_PATH"
                  codesign -dv --verbose=4 "$APP_PATH" 2>&1

                  echo "Validating notarization ticket on DMG: $DMG_PATH"
                  xcrun stapler validate "$DMG_PATH"

                  echo "Gatekeeper assess DMG"
                  spctl --assess --type open --context context:primary-signature --verbose=4 "$DMG_PATH"

            - name: Diagnostic (first unsigned Mach-O)
              if: failure() && matrix.platform == 'darwin'
              working-directory: electron
              run: |
                  APP_PATH=$(ls release/*.app | head -n 1 || true)
                  if [[ -z "$APP_PATH" ]]; then
                      echo "No .app found under electron/release for diagnostics."
                      exit 0
                  fi
                  python - "$APP_PATH" <<'PY'
                  import os
                  import subprocess
                  import sys

                  app_path = sys.argv[1]
                  first_unsigned = None
                  for root, _, files in os.walk(app_path):
                      for name in files:
                          p = os.path.join(root, name)
                          try:
                              f = subprocess.run(["file", "-b", p], capture_output=True, text=True, check=False)
                          except Exception:
                              continue
                          if "Mach-O" not in (f.stdout or ""):
                              continue
                          c = subprocess.run(["codesign", "-vv", p], capture_output=True, text=True, check=False)
                          if c.returncode != 0:
                              first_unsigned = p
                              break
                      if first_unsigned:
                          break

                  if first_unsigned:
                      print(f"First unsigned/invalid Mach-O: {first_unsigned}")
                      sys.exit(0)
                  print("No unsigned Mach-O binaries detected; failure may be notarization or policy-related.")
                  PY

            - name: Upload artifacts to release
              uses: softprops/action-gh-release@v2
              with:
                  files: |
                      electron/release/*.dmg
                      electron/release/*.exe
                      electron/release/*.AppImage
                      electron/release/*.deb
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
