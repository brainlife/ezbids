[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimport"
version = "0.1.0"
description = "brainlife.io/aimport: a local agentic data importer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydicom>=2.4",
    "nibabel",
    "PyYAML>=6",
    "bidsschematools",
    "autobidsify==0.9.9.1",
    "anthropic",
    "fastapi",
    "uvicorn",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/aimport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: tests that need a running Docker daemon and network",
    "docker_offline: tests that need Docker but no network",
    "docker_slow: Docker tests that take minutes per image (pydeface); run with -m docker_slow",
]
