[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aimport"
version = "0.1.0"
description = "brainlife.io/aimport: a local agentic data importer"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pydicom>=2.4",
    "nibabel",
    "PyYAML>=6",
    "bidsschematools",
    "autobidsify==0.9.9.1",
    "anthropic",
    "fastapi",
    "uvicorn",
    # microscopy (micr)
    "bioio",
    # CZI (bioio-czi, aicspylibczi) is GPL-3.0: the optional extra "czi" below, installed in the Docker engine
    # image only, so the desktop app ships no GPL code
    "bioio-nd2",
    "bioio-lif",
    "tifffile",
    "ome-types",
    "zarr>=3",
    "fsspec[http]",
    "dask[array]",
    "ngff-zarr",
    "scipy",
    "h5py",
    # electrophysiology and optical (ephys)
    "mne",
    "mne-bids",
    "edfio",
    "pybv",
    "defusedxml",
    "pynwb",
    "matplotlib",
    # the QA viewer's chunk proxy (micr/remote.py open_stream); already locked (anthropic needs it)
    "httpx>=0.28",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]
neo = ["neo"]
# GPL-3.0 (bioio-czi and aicspylibczi): never in the desktop runtime (fetch-aimport.sh fails if it is)
czi = ["bioio-czi"]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["src/aimport"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "docker: runs inside the brainlife/aimport image (needs network the first time, to fetch test data)",
    "docker_offline: tests that need Docker but no network",
    "docker_slow: Docker tests that take minutes per image (pydeface); run with -m docker_slow",
    "network: reads remote data over https (range reads, under 32 MiB per test)",
    "ephys_data: downloads small pinned ephys test files the first time and caches them in AIMPORT_EPHYS_CACHE (default ~/.cache/aimport-ephys)",
]
