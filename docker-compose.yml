# version: "3"

services:
    mongodb:
        container_name: brainlife_ezbids-mongodb
        image: mongo:4.4.15
        platform: linux/amd64
        volumes:
            - /data/db
        healthcheck:
            test: echo 'db.runCommand("ping").ok' | mongo localhost:27017/test --quiet
            interval: 10s
            timeout: 10s
            retries: 5
        ports:
            - 0.0.0.0:27017:27017 # exposed for services outside Docker (host + network)

    api:
        container_name: brainlife_ezbids-api
        build:
            context: .
            dockerfile: Dockerfile
        platform: linux/amd64
        volumes:
            - ./api:/app/api
            - ./tmp:/tmp
        depends_on:
            mongodb:
                condition: service_healthy
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:8082/health']
        working_dir: /app/api
        command: ./dev.sh
        environment:
            MONGO_CONNECTION_STRING: mongodb://mongodb:27017/ezbids
            BRAINLIFE_AUTHENTICATION: ${BRAINLIFE_AUTHENTICATION}
        ports:
            - 8082:8082 #localhost runs on local browser to it needs to access api via host port

    handler:
        container_name: brainlife_ezbids-handler
        build: ./handler
        platform: linux/amd64
        volumes:
            - .:/app
            - ./tmp:/tmp
        depends_on:
            mongodb:
                condition: service_healthy
            api:
                condition: service_healthy
        environment:
            MONGO_CONNECTION_STRING: mongodb://mongodb:27017/ezbids
            # the TypeScript handler (handler/*.ts) runs with ts-node; tool locations come from the image (handler/Dockerfile)
            EZBIDS_HANDLER_DIR: /app/handler
            EZBIDS_TELEMETRY_URL: ${EZBIDS_TELEMETRY_URL:-} # telemetry is off unless this is set
        tty: true #turn on color for bids-validator output
        working_dir: /app/handler
        command: node ../node_modules/ts-node-dev/lib/bin.js --respawn --transpile-only -P tsconfig.json handler.ts

    ui:
        container_name: brainlife_ezbids-ui
        build:
            context: .
            dockerfile: ui/Dockerfile
        platform: linux/amd64
        volumes:
            - ./ui/src:/app/ui/src #don't copy node_modules which might be compiled for mac (vite won't work)
        environment:
            VITE_APIHOST: http://localhost:8082
            API_HOST: http://localhost:8082 # written into public/runtime-env.js by ui/docker-entrypoint.sh
            BRAINLIFE_AUTHENTICATION: ${BRAINLIFE_AUTHENTICATION:-false}
            VITE_DEBUG: ${VITE_DEBUG:-false} # true shows raw JSON debug panels (they include PatientName/PatientID)
        healthcheck:
            test: ['CMD', 'curl', '-f', 'http://localhost:3000']
        ports:
            - 3000:3000 #vite wants to be exposed on the host for HMR?

    # by default this is not enabled, need to run docker compose with --profile development to enable this service
    telemetry:
        container_name: brainlife_ezbids-telemetry
        build: ./telemetry
        platform: linux/amd64
        depends_on:
            - mongodb
        profiles: ['development']
        ports:
            - 8000:8000 #for local debugging
